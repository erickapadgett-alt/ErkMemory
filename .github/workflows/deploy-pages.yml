name: Deploy pregnancy tracker to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/pregnancy-tracker-app-mi3lx0
    paths:
      - "pregnancy-tracker/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pregnancy-tracker/ to gh-pages branch
        run: |
          cd pregnancy-tracker
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy pregnancy tracker from $GITHUB_SHA"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
