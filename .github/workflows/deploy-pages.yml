name: Deploy pregnancy tracker to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/pregnancy-tracker-app-mi3lx0
    paths:
      - "pregnancy-tracker/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pregnancy-tracker

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
